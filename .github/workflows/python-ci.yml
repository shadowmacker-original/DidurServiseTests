name: Python Order Service CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'DidurOrder/**'
      - '.github/workflows/python-ci.yml'
  pull_request:
    paths:
      - 'DidurOrder/**'
      - '.github/workflows/python-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: DidurOrder

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with pytest
        run: |
          python -m pytest